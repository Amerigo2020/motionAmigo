name: Rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p motionamigo-wasm --target wasm32-unknown-unknown -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (release, runtime SIMD dispatch)
        run: cargo test --workspace --exclude motionamigo-py --release
      - name: Test with forced portable SIMD backend
        run: cargo test -p motionamigo --release
        env:
          MOTIONAMIGO_SIMD: portable

  test-wasi:
    # Runs the full test suite as WebAssembly (simd128 backend) under wasmtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install wasmtime
        run: |
          curl -sSL https://github.com/bytecodealliance/wasmtime/releases/download/v25.0.0/wasmtime-v25.0.0-x86_64-linux.tar.xz | tar xJ
          echo "$PWD/wasmtime-v25.0.0-x86_64-linux" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test -p motionamigo --release --target wasm32-wasip1 --lib --tests
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime --dir=.
          CARGO_TARGET_WASM32_WASIP1_RUSTFLAGS: -C target-feature=+simd128

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p motionamigo --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  bench-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p motionamigo --no-run

  scene-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate example scenes against the v0.1 schema
        run: uvx check-jsonschema --schemafile schema/scene-v0.1.json examples/scenes/*.json

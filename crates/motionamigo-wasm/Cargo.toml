[package]
name = "motionamigo-wasm"
description = "WebAssembly bindings for the motionAmigo browser demo"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
motionamigo.workspace = true
wasm-bindgen = "0.2"

# wasm-opt is run by web/build.sh with explicit feature flags instead.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

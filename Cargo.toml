[workspace]
resolver = "2"
members = [
    "crates/motionamigo",
    "crates/motionamigo-py",
    "crates/motionamigo-wasm",
    "bench",
]
default-members = ["crates/motionamigo", "bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["Amerigo Velletti"]
repository = "https://github.com/Amerigo2020/motionAmigo"
homepage = "https://github.com/Amerigo2020/motionAmigo"
keywords = ["robotics", "motion-planning", "simd", "rrt", "franka"]
categories = ["science::robotics", "algorithms"]

[workspace.dependencies]
motionamigo = { path = "crates/motionamigo", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
lto = "thin"
codegen-units = 1
debug = true
